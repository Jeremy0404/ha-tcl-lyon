version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # pytest-homeassistant-custom-component pins both exactly; they follow it.
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
